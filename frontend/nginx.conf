server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Sécurité — headers HTTP
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SPA (Single Page Application) : toutes les routes renvoient index.html
    # React Router gère la navigation côté client
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache les assets statiques (JS, CSS, images) pendant 1 an
    # Le hash dans le nom du fichier (main.a1b2c3.js) garantit l'invalidation
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Pas de cache pour index.html (il référence les assets avec hash)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
