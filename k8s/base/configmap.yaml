# ConfigMap stocke de la configuration NON SENSIBLE.
# Les valeurs sont injectées comme variables d'env dans les pods.
# Avantage : tu changes la config SANS reconstruire l'image Docker.
apiVersion: v1
kind: ConfigMap
metadata:
  name: banklens-config
  namespace: banklens
data:
  APP_NAME: "BankLens"
  AWS_REGION: "ca-central-1"
  BEDROCK_MODEL_ID: "anthropic.claude-3-haiku-20240307-v1:0"
  DD_SERVICE: "banklens-api"
  DD_ENV: "production"
  DD_VERSION: "1.0.0"
  # Ces valeurs sont visibles dans kubectl describe configmap
  # → JAMAIS de mots de passe ou clés API ici
