# Secret stocke les données SENSIBLES (mots de passe, clés API).
# Les valeurs sont encodées en base64 (PAS chiffrées par défaut).
# En production, on active le chiffrement at-rest sur le cluster EKS.
#
# ⚠️ Ce fichier ne devrait PAS être commité sur Git en production.
# On utilise AWS Secrets Manager ou External Secrets Operator à la place.
# Pour ce tuto, on le crée manuellement.
apiVersion: v1
kind: Secret
metadata:
  name: banklens-secrets
  namespace: banklens
type: Opaque
stringData:
  # stringData accepte du texte en clair (K8s encode en base64 automatiquement)
  DATABASE_URL: "postgresql+asyncpg://banklens:banklens_pwd@banklens-db:5432/banklens_db"
  SECRET_KEY: "production-secret-key-change-this"
